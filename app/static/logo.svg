<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo MoviBAQ -->
    <linearGradient id="moviGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0252CD"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Gradiente de reflejo metálico -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="softGaze" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0252CD" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Contenedor Base Cuadrado Curvo Moderno -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#moviGrad)" filter="url(#softGaze)"/>
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#glassShine)"/>

  <!-- Franja Tricolor Insignia de Barranquilla (Curva sutil superior) -->
  <path d="M 24 20 Q 60 14 96 20" stroke="#DC2626" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 28 24 Q 60 18 92 24" stroke="#FACC15" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 32 28 Q 60 22 88 28" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Silueta Frontal del Bus Scania Transmetro -->
  <!-- Carrocería principal -->
  <rect x="30" y="36" width="60" height="58" rx="14" fill="#FFFFFF"/>
  
  <!-- Parabrisas panorámico -->
  <rect x="36" y="42" width="48" height="24" rx="6" fill="url(#windshieldGrad)"/>
  
  <!-- Letrero de Ruta LED / Destino -->
  <rect x="42" y="38" width="36" height="5" rx="2.5" fill="#0B132B"/>
  <rect x="45" y="39.5" width="30" height="2" rx="1" fill="#FACC15"/>

  <!-- Luces / Farolas LED modernas -->
  <circle cx="41" cy="74" r="4.5" fill="#FACC15"/>
  <circle cx="41" cy="74" r="2" fill="#FFFFFF"/>
  <circle cx="79" cy="74" r="4.5" fill="#FACC15"/>
  <circle cx="79" cy="74" r="2" fill="#FFFFFF"/>

  <!-- Parrilla / Rejilla frontal -->
  <rect x="50" y="72" width="20" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="53" y="78" width="14" height="2.5" rx="1" fill="#94A3B8"/>

  <!-- Llantas inferiores estilizadas -->
  <rect x="33" y="90" width="10" height="9" rx="3" fill="#1E293B"/>
  <rect x="77" y="90" width="10" height="9" rx="3" fill="#1E293B"/>

  <!-- Señal de ondas GPS / Satelital en Vivo (Esquina superior derecha) -->
  <circle cx="86" cy="34" r="4" fill="#10B981"/>
  <circle cx="86" cy="34" r="8" stroke="#10B981" stroke-width="2" fill="none" opacity="0.75"/>
  <circle cx="86" cy="34" r="13" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.45"/>
</svg>

